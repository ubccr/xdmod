services:
    xdmod:
        image: ${XDMOD_IMAGE}
        container_name: xdmod
        hostname: xdmod
        networks:
            - testing-rocky8
        shm_size: 2g
        ports:
            - 9006:443
            - 7000:7000
        environment:
            XDMOD_REALMS: ${XDMOD_REALMS}
        stdin_open: true
        tty: true
        command: sleep infinity
    playwright:
        image: ${PLAYWRIGHT_IMAGE}
        hostname: playwright
        container_name: playwright
        networks:
            - testing-rocky8
        stdin_open: true
        tty: true
        ipc: host
        links:
            - xdmod
        depends_on:
            - xdmod
        environment:
            BASE_URL: https://xdmod
            XDMOD_REALMS: ${XDMOD_REALMS}
        command: sleep infinity
networks:
    testing-rocky8:
