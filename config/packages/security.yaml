security:
    password_hashers:
        CCR\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        username_provider:
            id: CCR\Security\UsernameUserProvider
        all_users:
            chain:
                providers: ['username_provider']
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        token:
            lazy: true
            stateless: true
            pattern:
              - ^/rest/warehouse/export/realms
              - ^/rest/warehouse/raw-data
            provider: username_provider
            access_token:
                token_handler: CCR\Security\TokenHandlers\TokenHandler
                token_extractors:
                    - 'header'
                    - CCR\Security\TokenExtractors\QueryTokenExtractor
                    - 'request_body'
        main:
            lazy: true
            provider: username_provider
            access_token:
                token_handler: CCR\Security\TokenHandlers\TokenHandler
                token_extractors:
                    - 'header'
                    - CCR\Security\TokenExtractors\QueryTokenExtractor
                    - 'request_body'
            custom_authenticators:
                - CCR\Security\Authenticators\FormLoginAuthenticator
                - CCR\Security\Authenticators\SimpleSamlPhpAuthenticator
            switch_user: true
            logout:
                path: /logout
            entry_point: CCR\Security\Authenticators\FormLoginAuthenticator
    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS}
